<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BionPact Pte Ltd</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
         background:#0e1512; color:#e8f0ea; padding:2rem; }
  main { max-width:44rem; }
  .band { height:6px; width:100%; background:linear-gradient(90deg,#2f6b4f,#8fc9a5,#2f6b4f); border-radius:99px; margin-bottom:2rem; }
  h1 { font-size:clamp(1.9rem,5vw,3rem); margin:0 0 .6rem; letter-spacing:-.02em; }
  .env { display:inline-block; font-size:.72rem; letter-spacing:.14em; text-transform:uppercase;
          padding:.32rem .7rem; border:1px solid #2f6b4f; border-radius:99px; color:#8fc9a5; margin-bottom:1.4rem; }
  p { line-height:1.65; color:#b7c7bd; margin:0 0 1rem; }
  footer { margin-top:2.4rem; font-size:.8rem; color:#6c8579; border-top:1px solid #1e2b25; padding-top:1.2rem; }
  a { color:#8fc9a5; }
</style>
</head>
<body>
<main>
  <div class="band"></div>
  <span class="env">beta</span>
  <h1>BionPact Pte Ltd</h1>
  <p>This site is provisioned and awaiting content. It is served from the
     <code>bionpact_site_beta</code> repository over GitHub Pages.</p>
  <p>Agentic package design API for print-on-demand — see
     <a href="https://github.com/orgs/BionPact-Pte-Ltd/repositories">BionPact-Pte-Ltd repositories</a>.</p>
  <footer>BionPact Pte Ltd · beta.bp.truesight.me</footer>
</main>
</body>
</html>
